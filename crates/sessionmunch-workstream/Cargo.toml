# Kimi wire records timestamp in ms epoch; jiff renders them RFC3339 like the
# other harnesses' native ISO strings.
jiff.workspace = true
rusqlite.workspace = true
tokio.workspace = true
uuid.workspace = true
# For the HTTP drain sink (Sleeper batch ingest). Native-roots TLS keeps
# private-PKI servers (the project's HTTPS-via-proxy path) reachable.
reqwest.workspace = true
async-trait.workspace = true
thiserror.workspace = true

