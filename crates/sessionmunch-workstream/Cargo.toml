[package]
name = "sessionmunch-workstream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Read-only native harness adapters and managed launch planning for sessionmunch."

[dependencies]
sessionmunch-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# For compressing large artifact evidence (content-addressed storage).
