[package]
name = "sessionmunch-hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Hook payload schemas, sanitisation, and HTTP ingress for agent lifecycle hooks."
# One integration-test binary instead of one per file. Each binary
# statically links the whole dep graph and gets scanned by macOS on
# first run.

[dependencies]
sessionmunch-core.workspace = true
sessionmunch-store.workspace = true
sessionmunch-wiki.workspace = true
sessionmunch-consolidate.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Parse the per-event `?event=…` query of each spooled URL in `/hook/batch`,
# the same crate (and version) axum's `Query` extractor uses for `/hook`.
serde_urlencoded = "0.7"
tokio.workspace = true
tracing.workspace = true
jiff.workspace = true
uuid.workspace = true
axum.workspace = true
sha2.workspace = true

[dev-dependencies]
sessionmunch-test-support.workspace = true
tempfile.workspace = true
git2.workspace = true
sessionmunch-llm.workspace = true
async-trait.workspace = true

[lints]
workspace = true
