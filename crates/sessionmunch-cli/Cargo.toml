[package]
name = "sessionmunch-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "`sessionmunch` binary entry point."
# One integration-test binary instead of one per file. Each binary
# statically links the whole dep graph and gets scanned by macOS on
# first run.

[lib]
name = "sessionmunch_cli"
path = "src/lib.rs"

[[bin]]
name = "sessionmunch"
path = "src/main.rs"
# main.rs is a shim with no tests of its own. Without this, `cargo test` builds
# a second ~120 MB harness binary for it that contains no tests.
test = false

[dependencies]
sessionmunch-consolidate.workspace = true
sessionmunch-core.workspace = true
sessionmunch-hooks.workspace = true
sessionmunch-llm.workspace = true
sessionmunch-mcp.workspace = true
sessionmunch-store.workspace = true
sessionmunch-web.workspace = true
sessionmunch-workstream.workspace = true
sessionmunch-wiki.workspace = true
reqwest.workspace = true
secrecy.workspace = true
sha2.workspace = true
base64.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
dirs.workspace = true
figment.workspace = true
flate2.workspace = true
fs2.workspace = true
# `transport-streamable-http-client-reqwest` pulls reqwest in with no TLS backend
# (`__reqwest = ["dep:reqwest"]` and nothing more), so the bridge could not reach an
# `https://` MCP server at all.
#
# `reqwest-tls-no-provider` is `reqwest?/rustls-no-provider`: the platform verifier
# without a pinned crypto provider. rmcp's plain `reqwest` feature would be
# `reqwest?/rustls`, which additionally pins aws-lc-rs — and with it a C toolchain
# (cmake/nasm on Windows) in every build of this workspace. `ring` is already in the
# lockfile via the reqwest 0.12 the rest of the workspace uses, so the bridge
# installs that as the process default instead (see `install_crypto_provider` in
# `commands/mcp_bridge.rs`).
#
# The crypto provider is the whole of the difference. Both routes go through
# `rustls-platform-verifier`, so both put its deps — including `jni` and
# `rustls-platform-verifier-android` — in the lockfile. Those are target-gated and
# are not compiled for our platforms, but they are not avoided by this choice, and
# a comment claiming otherwise would misdirect the next TLS decision here.
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest-tls-no-provider",
] }
rustls = { workspace = true }
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
sysinfo.workspace = true
tar.workspace = true
jiff.workspace = true
jsonc-parser.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

tempfile.workspace = true

[dev-dependencies]
sessionmunch-test-support.workspace = true
# The backfill end-to-end test asserts on the derived section/passage
# tables directly; nothing in the public store API exposes their row
# counts, and the pre-G1 fixture shape can only be produced with SQL.
rusqlite.workspace = true
tempfile.workspace = true
rstest.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
