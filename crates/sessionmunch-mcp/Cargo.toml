[package]
name = "sessionmunch-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MCP server transport and tool router for sessionmunch."
# One integration-test binary instead of one per file. Each binary
# statically links the whole dep graph and gets scanned by macOS on
# first run.

[dependencies]
sessionmunch-core.workspace = true
sessionmunch-consolidate.workspace = true
sessionmunch-llm.workspace = true
uuid.workspace = true
sessionmunch-store.workspace = true
sessionmunch-wiki.workspace = true
anyhow.workspace = true
thiserror.workspace = true
flate2.workspace = true
tar.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
rmcp.workspace = true
schemars.workspace = true
axum.workspace = true
http.workspace = true
# HTTP auth middleware: constant-time Bearer compare. Basic is not a
# credential; sessions live in human_auth.
subtle.workspace = true
base64.workspace = true
getrandom.workspace = true
# Time gap calculation for `memory_explore` (parse stored ISO-8601
# timestamps + delta against now). The rest of the crate doesn't
# need a clock dep.
jiff.workspace = true

[dev-dependencies]
sessionmunch-core.workspace = true
