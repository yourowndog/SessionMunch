# docker-compose.yml for sessionmunch.
#
# Run from this directory:
#   docker compose up -d
# Attach Claude Code (or any MCP HTTP client) at
#   http://localhost:49374/mcp
# State persists in the `sessionmunch-data` volume; move it between hosts
# by stopping the container, `docker volume export` (or rsync the
# mountpoint), and importing on the target.

services:
  sessionmunch:
    image: sessionmunch:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sessionmunch
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - sessionmunch-data:/data
    ports:
      # Bind to loopback by default; flip to 0.0.0.0:49374 when serving
      # the homelab LAN. Keep behind a reverse proxy if you do.
      - "127.0.0.1:49374:49374"
    env_file:
      - path: .env
        required: false
    environment:
      - RUST_LOG=sessionmunch=info,sessionmunch_store=info,sessionmunch_wiki=info,sessionmunch_mcp=info,tracing_appender=warn
      # LLM provider configured via docker/.env (gitignored). Options:
      # anthropic | openai | openai-oauth | anthropic-oauth | copilot |
      # gemini | openai-compat | opencode
      # See .env.production.example for the full reference.
      #
      # Extra headers on every LLM chat request, for a gateway that requires
      # a caller-identifying one. Comma-separated `Name=Value` entries; the
      # default `User-Agent: sessionmunch/<version>` needs no configuration.
      # - SESSIONMUNCH_LLM_HEADERS=x-opencode-session=homelab-01
    healthcheck:
      test: ["CMD", "/usr/local/bin/sessionmunch", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sessionmunch-data:
    name: sessionmunch-data
