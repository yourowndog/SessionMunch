# Two-operator simulation: an SSO-terminating proxy in front of one server.
#
# This is the posture the multi-operator work targets: identities arrive as
# headers asserted by a proxy that authenticates with a dedicated bearer,
# and no `users` row ever exists.

data_dir = "/data"
bind = "0.0.0.0:49374"
log_level = "sessionmunch=debug,sessionmunch_mcp=debug,sessionmunch_store=info,sessionmunch_wiki=info,sessionmunch_hooks=debug"

[auth]
# Direct administration uses this; the proxy never receives it.
bearer_token = "root-token-for-the-proxy-only"
root_username = "operator-root"
# The proxy authenticates with this distinct user-tier credential.
actor_proxy_bearer_token = "proxy-token-for-the-proxy-only"

[slots]
# The feature under test. Default is false; a separate run covers that.
per_user = true
